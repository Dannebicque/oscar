; Réglages de production d'Oscar.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 120
; Pièces jointes jusqu'à 25 Mo par message (limite réglée par compte), envoyées en base64 dans le JSON : ~33 Mo.
post_max_size = 40M
upload_max_filesize = 40M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
