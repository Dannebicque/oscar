; Réglages de production d'Oscar.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
; Pièces jointes jusqu'à 5 Mo (envoyées en base64 dans le JSON : ~6,7 Mo).
post_max_size = 12M
upload_max_filesize = 12M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
