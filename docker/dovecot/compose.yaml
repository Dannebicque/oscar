# Serveur IMAP de test, local uniquement (127.0.0.1). JAMAIS exposé : les mots de passe sont publics, dans le dépôt.
#   docker compose -f docker/dovecot/compose.yaml up -d
#   python3 docker/dovecot/seed.py        # charge les mails de test
#   python3 docker/dovecot/smoke.py       # vérifie le scénario
services:
  dovecot:
    image: dovecot/dovecot:2.3.21
    platform: linux/amd64 # seule architecture publiée ; émulée sur Apple Silicon
    container_name: oscar-dovecot
    ports:
      - '127.0.0.1:1143:143' # IMAP (sans TLS : test uniquement)
    volumes:
      - ./conf/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./conf/users:/etc/dovecot/users:ro
    # Boîtes en mémoire : jetables, rapides, aucune écriture disque. Après un redémarrage : relancer seed.py.
    tmpfs:
      - /srv/mail:uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ['CMD-SHELL', 'doveadm service status >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
