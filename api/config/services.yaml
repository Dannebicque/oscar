# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\CasClient:
        arguments:
            $baseUrl: '%env(CAS_BASE_URL)%'

    App\Security\TokenService:
        arguments:
            $ttlSeconds: 43200

    App\Security\CredentialVault:
        arguments:
            $base64Key: '%env(APP_VAULT_KEY)%'

    App\Controller\PasswordAuthController:
        arguments:
            $registration: '%env(APP_REGISTRATION)%'
            $frontUrl: '%env(FRONT_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'
            $casBaseUrl: '%env(CAS_BASE_URL)%'

    App\Mail\OutgoingMailer: '@App\Mail\SymfonyOutgoingMailer'
    App\Calendar\CalendarProvider: '@App\Calendar\CalDavProvider'
    App\Ai\AiProvider: '@App\Ai\HeuristicProvider'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\Tests\Support\FakeCalendarProvider:
            public: true
        App\Tests\Support\SpyAiProvider:
            public: true
        App\Ai\AiProvider: '@App\Tests\Support\SpyAiProvider'
        App\Calendar\CalendarProvider: '@App\Tests\Support\FakeCalendarProvider'
        App\Recap\RecapService:
            public: true
        App\Recap\RelanceNotifier:
            public: true
        App\Mail\ConnectionMonitor:
            public: true
        App\Tests\Support\FakeOutgoingMailer:
            public: true
        App\Mail\OutgoingMailer: '@App\Tests\Support\FakeOutgoingMailer'
        App\Mail\MailboxReaderFactory:
            public: true
            class: App\Tests\Support\FakeReaderFactory
            arguments: ['@App\Security\CredentialVault']
