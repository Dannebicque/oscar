security:
    providers:
        app_user:
            entity: { class: App\Entity\User, property: username }
    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user
            access_token:
                token_handler: App\Security\ApiTokenHandler
    access_control:
        - { path: ^/api/auth/(dev-login|cas/login|cas/callback|token)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(docs|$), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
