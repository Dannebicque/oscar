# Déploiement d'Oscar : base PostgreSQL, application (HTTPS, API, front) et worker (synchronisation, récaps, relances).
#   cp docker/prod/env.example .env.prod   # puis remplir (voir docs/INSTALL.md)
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
name: oscar

x-oscar: &oscar
  build: { context: ., dockerfile: Dockerfile }
  image: oscar:latest
  env_file: .env.prod
  environment:
    APP_ENV: prod
    DATABASE_URL: postgresql://oscar:${POSTGRES_PASSWORD}@db:5432/oscar?serverVersion=17&charset=utf8
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oscar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oscar
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscar -d oscar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *oscar
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://oscar:${POSTGRES_PASSWORD}@db:5432/oscar?serverVersion=17&charset=utf8
      RUN_MIGRATIONS: "1"
      SERVER_NAME: ${SERVER_NAME:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_share:/app/var/share

  # Tâches de fond : synchronisation des boîtes et agendas, récaps, relances. Redémarré régulièrement pour libérer la mémoire.
  worker:
    <<: *oscar
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    volumes:
      - app_share:/app/var/share

volumes:
  db_data:
  caddy_data:
  caddy_config:
  app_share:
